<path d="M539 251H575M568 245L575 251L568 257" fill="none" stroke="#19719e" stroke-width="2.5"/><text class="entry" x="577" y="270">楼梯出口</text>
</g>
<rect class="box" x="790" y="150" width="740" height="470" rx="10"/><text class="tx" x="820" y="190">插座回路表（平面表达）</text><path d="M810 210H1510M920 210V405M1110 210V405M1280 210V405M810 405H1510" stroke="#cbd8dd" stroke-width="1.2"/>
<text class="sm" x="830" y="238">回路</text><text class="sm" x="950" y="238">服务区域</text><text class="sm" x="1140" y="238">图中线路</text><text class="sm" x="1310" y="238">插座形式 / 安装建议</text>
<g class="sm"><text x="830" y="280">C7</text><text x="950" y="280">直播 / 日常办公</text><text x="1140" y="280">蓝色实线</text><text x="1310" y="280">保留3个普通五孔，设备到位复核</text><text x="830" y="330">C8</text><text x="950" y="330">主电脑位</text><text x="1140" y="330">蓝色实线</text><text x="1310" y="330">保留1个普通五孔，UPS/弱电另核</text><text x="830" y="380">AP-2</text><text x="950" y="380">二楼分配电箱</text><text x="1140" y="380">放射式引出</text><text x="1310" y="380">断路器、线径现场深化</text></g>
<g id="lighting-plan-reference">
  <text class="tx" x="830" y="450">窗腰梁壁灯 · WL1</text>
  <path d="M830 483H890" fill="none" stroke="#946a3c" stroke-width="2" stroke-dasharray="3 5"/>
  <text class="sm" x="904" y="488">夹层范围内的梁侧照明投影</text>
  <text class="sm" x="830" y="526">本组窗腰梁壁灯共九盏，统一在一楼 WL1 项计量。</text>
  <a href="./1801_一楼插座回路示意.svg"><text x="830" y="562" class="entry" text-decoration="underline">查看一楼图上的 L01–L09 与配电路径</text></a>
</g>
<rect class="box" x="790" y="650" width="740" height="155" rx="10"/><text class="tx" x="820" y="688">图例与施工边界</text><g class="sm"><text x="820" y="722">○=普通插座点　AP=配电箱　蓝实线=普通插座回路</text><text x="820" y="752">灰色虚线沿 L 形洞口划定，挑空 17.23 ㎡。夹层模型楼面 64.74 ㎡。</text><text x="820" y="782">最终线径、漏保、接地、桥架及大功率设备专线应由持证电工结合设备清单、物业条件和消防要求深化。</text></g>
<text class="sm" x="70" y="920">统一阅读方向：屏幕下方 = 原正门入口　｜　版本：插座位置及回路表达优化版 · 二楼</text>
</svg>
