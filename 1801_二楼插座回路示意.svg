<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <style>
    .title{font:600 30px 'Microsoft YaHei',sans-serif;fill:#173247}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#557080}.txt{font:16px 'Microsoft YaHei',sans-serif;fill:#243b4a}.small{font:14px 'Microsoft YaHei',sans-serif;fill:#557080}.wall{fill:#f7f5ef;stroke:#3c4c55;stroke-width:8}.zone{fill:#eef3f1;stroke:#8195a0;stroke-width:2}.route{fill:none;stroke:#237aab;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.socket{fill:#fff;stroke:#db563d;stroke-width:4}.note{fill:#fffdf8;stroke:#d2dfe4;stroke-width:2}.db{fill:#254b62;stroke:#fff;stroke-width:3}.void{fill:#dce5e8;stroke:#627683;stroke-width:2;stroke-dasharray:8 7}
  </style>
  <rect width="1400" height="920" fill="#f5f8f9"/>
  <text class="title" x="70" y="62">1801 · 二楼插座回路示意图</text><text class="sub" x="70" y="92">二楼为开放办公区；红色点位均为插座预留，楼梯洞口和踏步不在本图中表达。</text>
  <path class="wall" d="M190 160H1050V740H190V520H420V160Z"/>
  <rect class="zone" x="210" y="180" width="280" height="310"/><text class="txt" x="275" y="315">茶台 / 休闲区</text><text class="small" x="285" y="343">D5 茶台回路</text>
  <rect class="zone" x="510" y="180" width="520" height="310"/><text class="txt" x="695" y="315">主办公 / 日常办公区</text><text class="small" x="725" y="343">D6 办公插座回路</text>
  <rect class="void" x="210" y="515" width="325" height="205"/><text class="txt" x="292" y="610">楼梯洞口</text><text class="small" x="303" y="637">踏步隐藏</text>
  <rect class="zone" x="560" y="515" width="470" height="205"/><text class="txt" x="700" y="610">开放预留区</text><text class="small" x="735" y="637">D7 预留插座回路</text>
  <rect class="db" x="990" y="744" width="62" height="42" rx="4"/><text x="1002" y="771" fill="#fff" font-family="Microsoft YaHei" font-size="15">DB-2</text><text class="small" x="935" y="815">二楼分配电箱建议位</text>
  <path class="route" d="M1020 744V690H770V335M1020 690H350V330M1020 690H770V620"/>
  <!-- D5 tea / lounge -->
  <g class="socket"><rect x="228" y="197" width="22" height="16"/><rect x="330" y="197" width="22" height="16"/><rect x="450" y="197" width="22" height="16"/><rect x="472" y="300" width="16" height="22"/><rect x="472" y="420" width="16" height="22"/></g>
  <!-- D6 main office -->
  <g class="socket"><rect x="540" y="197" width="22" height="16"/><rect x="665" y="197" width="22" height="16"/><rect x="790" y="197" width="22" height="16"/><rect x="915" y="197" width="22" height="16"/><rect x="1012" y="300" width="16" height="22"/><rect x="1012" y="420" width="16" height="22"/><rect x="850" y="472" width="22" height="16"/><rect x="700" y="472" width="22" height="16"/></g>
  <!-- D7 open reserve -->
  <g class="socket"><rect x="590" y="532" width="22" height="16"/><rect x="720" y="532" width="22" height="16"/><rect x="850" y="532" width="22" height="16"/><rect x="1012" y="575" width="16" height="22"/><rect x="1012" y="670" width="16" height="22"/><rect x="850" y="702" width="22" height="16"/><rect x="700" y="702" width="22" height="16"/><rect x="560" y="702" width="22" height="16"/></g>
  <g transform="translate(1110 165)"><rect class="note" width="220" height="230" rx="10"/><text class="txt" x="18" y="38">图例</text><rect class="socket" x="18" y="60" width="22" height="16"/><text class="small" x="52" y="75">预留插座点</text><path class="route" d="M18 112H45"/><text class="small" x="52" y="117">建议敷设走向</text><rect class="db" x="18" y="145" width="38" height="25"/><text class="small" x="65" y="164">二楼分配电箱</text><text class="small" x="18" y="205">D5：茶台/休闲</text><text class="small" x="118" y="205">D6：主办公</text><text class="small" x="18" y="228">D7：开放预留</text></g>
  <rect class="note" x="70" y="842" width="980" height="45" rx="8"/><text class="small" x="90" y="870">本图为插座位置与回路示意。最终回路数、线径、断路器、弱电与空调专线须由现场持证电工按负荷及物业要求深化确认。</text>
</svg>
