<text x="231.819" y="336.887" text-anchor="middle" class="sm">L 形楼梯洞口</text>
<text x="312.221" y="257.754" text-anchor="middle" class="sm">挑空 17.23 ㎡</text>
<rect class="part" x="100" y="425" width="170" height="280"/><text class="tx" x="139" y="540">临挑空茶台</text><text class="sm" x="178" y="563">C6</text>
