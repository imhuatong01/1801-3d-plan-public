<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<style>
 .t{font:600 30px 'Microsoft YaHei',sans-serif;fill:#142d40}.st{font:15px 'Microsoft YaHei',sans-serif;fill:#587181}.tx{font:16px 'Microsoft YaHei',sans-serif;fill:#1e3d51}.sm{font:13px 'Microsoft YaHei',sans-serif;fill:#4e6677}.wall{fill:#fbfaf6;stroke:#26363e;stroke-width:7;stroke-linejoin:round}.part{fill:#f2f6f5;stroke:#80939d;stroke-width:1.5}.wet{fill:#e4f0ef;stroke:#416b73;stroke-width:2}.void{fill:#e5ecef;stroke:#6c7f8a;stroke-width:2;stroke-dasharray:9 7}.wire{fill:none;stroke:#116eaa;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.wire2{fill:none;stroke:#734f9e;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7}.wire3{fill:none;stroke:#b46821;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 7}.out{fill:#fff;stroke:#c9312b;stroke-width:2.5}.db{fill:#224b67;stroke:#fff;stroke-width:2}.dim{stroke:#9fb0b8;stroke-width:1.3;fill:none}.dimt{font:13px 'Microsoft YaHei',sans-serif;fill:#778d99}.box{fill:#fffefa;stroke:#cbd8dd;stroke-width:1.5}.drawing{transform:rotate(180deg);transform-origin:362px 540px}.drawing text{transform:rotate(180deg);transform-box:fill-box;transform-origin:center}.entry{font:600 15px 'Microsoft YaHei',sans-serif;fill:#19719e}
</style>
<rect width="1600" height="980" fill="#f2f6f7"/>
<text class="t" x="70" y="54">1801 · 一楼插座及回路平面图</text>
<text class="st" x="70" y="82">依据当前 1801 CAD 外轮廓（含门前短入口、上部延伸及墙端折角）绘制；楼梯踏步隐藏，仅保留洞口和平台下卫浴位置。</text>
<!-- CAD outer contour, 1:30 schematic scale. Rotated to keep the original entrance at screen bottom. -->
<g class="drawing">
<path class="wall" d="M91 470L187 470L224 470L344 470L344 437L344 379L391 379L391 415L391 418L394 418L623 418L623 421L638 421L638 418L641 418L653 418L653 700L74 700L74 697L70 697L70 685L70 670L70 470L72 470L78 470Z"/>
<!-- Functional drawing zones located from the current model coordinates -->
<rect class="part" x="82" y="478" width="258" height="214"/><text class="tx" x="164" y="570">开放办公预留区</text><text class="sm" x="178" y="593">C1 普通插座</text>
<rect class="part" x="345" y="379" width="47" height="321" fill="#edf1f1"/><text class="sm" transform="translate(371 610) rotate(-90)">下沉通道</text>
<rect class="part" x="398" y="497" width="93" height="195"/><text class="sm" x="410" y="567">吧台 / 休闲</text><text class="sm" x="419" y="586">C2</text>
<rect class="part" x="571" y="427" width="75" height="257"/><text class="sm" transform="translate(617 590) rotate(-90)">健身 / 开放预留 C3</text>
<path class="void" d="M390 424H596V518H530V624H390Z"/><text class="tx" x="422" y="516">U 型楼梯洞口</text><text class="sm" x="428" y="538">踏步隐藏</text>
<rect class="wet" x="393" y="424" width="65" height="93"/><text class="sm" x="403" y="464">卫浴</text><text class="sm" x="402" y="484">C4-RCD</text>
<!-- dimension strings derived from CAD data -->
<path class="dim" d="M70 725H653M70 716V735M653 716V735"/><text class="dimt" x="319" y="744">CAD 主体最大宽 19.425m</text>
<path class="dim" d="M670 700V379M662 700H678M662 379H678"/><text class="dimt" transform="translate(690 598) rotate(-90)">含入口最大进深 10.700m</text>
<path class="dim" d="M70 455H344M70 448V462M344 448V462"/><text class="dimt" x="149" y="447">主体进深 7.675m</text>
<!-- distribution board and radial circuits -->
<rect class="db" x="318" y="715" width="55" height="32" rx="3"/><text x="329" y="737" fill="#fff" font-family="Microsoft YaHei" font-size="14">AP-1</text><text class="sm" x="279" y="767">建议进门侧配电箱</text>
<path class="wire" d="M345 715V675H205V520"/><path class="wire2" d="M345 675H445V470H425"/>
<!-- C1: three points on each long wall, plus two centred points at the entry-side wall. -->
<g class="out"><g transform="translate(165 482)"><circle r="9"/><path d="M-4-3V4M4-3V4"/></g><g transform="translate(211 482)"><circle r="9"/><path d="M-4-3V4M4-3V4"/></g><g transform="translate(257 482)"><circle r="9"/><path d="M-4-3V4M4-3V4"/></g><g transform="translate(165 688)"><circle r="9"/><path d="M-4-3V4M4-3V4"/></g><g transform="translate(211 688)"><circle r="9"/><path d="M-4-3V4M4-3V4"/></g><g transform="translate(257 688)"><circle r="9"/><path d="M-4-3V4M4-3V4"/></g><g transform="translate(90 548)"><circle r="9"/><path d="M-4-3V4M4-3V4"/></g><g transform="translate(90 620)"><circle r="9"/><path d="M-4-3V4M4-3V4"/></g></g>
<!-- C2 and C3 points removed in the confirmed layout. -->
<g class="out"><g transform="translate(447 500)"><circle r="9"/><path d="M-4-3V4M4-3V4"/></g></g>
<path d="M391 398V374M381 387L391 374L401 387" fill="none" stroke="#19719e" stroke-width="2.5"/><text class="entry" x="402" y="390">原正门入口</text>
</g>
<!-- Circuit schedule -->
<rect class="box" x="760" y="150" width="760" height="490" rx="10"/><text class="tx" x="790" y="190">插座回路表（平面表达）</text>
<path d="M780 210H1500M900 210V600M1090 210V600M1270 210V600" stroke="#cbd8dd" stroke-width="1.2"/>
<text class="sm" x="800" y="238">回路</text><text class="sm" x="930" y="238">服务区域</text><text class="sm" x="1120" y="238">图中线路</text><text class="sm" x="1300" y="238">插座形式 / 安装建议</text>
<g class="sm"><text x="800" y="280">C1</text><text x="930" y="280">右侧开放办公区</text><text x="1120" y="280">蓝色实线</text><text x="1300" y="280">8个普通五孔：两长墙中段各3个，外侧右墙2个</text><text x="800" y="330">C4</text><text x="930" y="330">平台下卫浴</text><text x="1120" y="330">紫色虚线</text><text x="1300" y="330">仅1个防溅漏保插座，设于洗手干区后墙</text><text x="800" y="380">AP-1</text><text x="930" y="380">一楼分配电箱</text><text x="1120" y="380">放射式引出</text><text x="1300" y="380">具体断路器、线径由电工深化</text></g>
<rect class="box" x="760" y="670" width="760" height="140" rx="10"/><text class="tx" x="790" y="708">图例与施工边界</text><g class="sm"><text x="790" y="740">○=普通插座点　AP=配电箱　蓝实线=普通回路　紫虚线=卫浴漏保回路　橙点划线=独立负荷预留</text><text x="790" y="770">本图按当前 CAD 外轮廓及网页已确认平面绘制，不替代强电施工图。线径、回路容量、接地、漏保、空调/健身设备专线须结合设备清单和物业条件确认。</text></g>
<text class="sm" x="70" y="920">统一阅读方向：屏幕下方 = 原正门入口　｜　版本：插座位置及回路表达优化版 · 一楼</text>
</svg>
