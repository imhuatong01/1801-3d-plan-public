<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <style>
    .title{font:600 30px 'Microsoft YaHei',sans-serif;fill:#173247}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#557080}.txt{font:16px 'Microsoft YaHei',sans-serif;fill:#243b4a}.small{font:14px 'Microsoft YaHei',sans-serif;fill:#557080}.wall{fill:#f7f5ef;stroke:#3c4c55;stroke-width:8}.zone{fill:#edf3f4;stroke:#8195a0;stroke-width:2}.route{fill:none;stroke:#237aab;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.route2{fill:none;stroke:#765aa6;stroke-width:5;stroke-dasharray:10 8;stroke-linecap:round}.socket{fill:#fff;stroke:#db563d;stroke-width:4}.note{fill:#fffdf8;stroke:#d2dfe4;stroke-width:2}.db{fill:#254b62;stroke:#fff;stroke-width:3}.void{fill:#dce5e8;stroke:#627683;stroke-width:2;stroke-dasharray:8 7}
  </style>
  <rect width="1400" height="920" fill="#f5f8f9"/>
  <text class="title" x="70" y="62">1801 · 一楼插座回路示意图</text><text class="sub" x="70" y="92">所有红色点位为预留插座；蓝线仅表示建议敷设走向。踏步已隐藏，不作为本图表达内容。</text>
  <rect class="wall" x="70" y="160" width="1110" height="600" rx="4"/>
  <rect class="zone" x="85" y="180" width="500" height="560"/><text class="txt" x="245" y="450">右侧开放办公预留区</text><text class="small" x="245" y="476">D1 普通插座回路</text>
  <rect class="zone" x="615" y="180" width="170" height="560" fill="#e7edef"/><text class="small" x="640" y="420">下沉通道</text>
  <rect class="zone" x="815" y="180" width="345" height="230"/><text class="txt" x="905" y="285">吧台 / 健身区</text><text class="small" x="925" y="312">D2 专用插座回路</text>
  <rect class="zone" x="815" y="435" width="345" height="305"/><text class="txt" x="900" y="570">开放预留区</text><text class="small" x="925" y="596">D3 普通插座回路</text>
  <rect class="void" x="615" y="550" width="255" height="190"/><text class="txt" x="650" y="635">楼梯 / 平台下</text><text class="small" x="653" y="660">踏步隐藏</text>
  <rect class="zone" x="620" y="565" width="125" height="160" fill="#d9e5e7"/><text class="small" x="632" y="650">卫浴</text><text class="small" x="628" y="672">D4 防溅回路</text>
  <rect class="db" x="770" y="746" width="62" height="42" rx="4"/><text x="782" y="773" fill="#fff" font-family="Microsoft YaHei" font-size="15">DB-1</text><text class="small" x="750" y="814">建议配电箱 / 进门侧</text>
  <path class="route" d="M801 746V705H670V620M801 705V700H180V310M801 705H1080V270M801 705H1080V590"/>
  <path class="route2" d="M670 620H735"/>
  <!-- D1 sockets: office perimeter -->
  <g class="socket"><rect x="107" y="207" width="22" height="16"/><rect x="230" y="207" width="22" height="16"/><rect x="355" y="207" width="22" height="16"/><rect x="480" y="207" width="22" height="16"/><rect x="555" y="315" width="16" height="22"/><rect x="555" y="455" width="16" height="22"/><rect x="555" y="595" width="16" height="22"/><rect x="450" y="716" width="22" height="16"/><rect x="300" y="716" width="22" height="16"/><rect x="150" y="716" width="22" height="16"/></g>
  <!-- D2 sockets: bar/gym -->
  <g class="socket"><rect x="845" y="207" width="22" height="16"/><rect x="965" y="207" width="22" height="16"/><rect x="1085" y="207" width="22" height="16"/><rect x="1132" y="318" width="16" height="22"/><rect x="1132" y="455" width="16" height="22"/></g>
  <!-- D3 sockets: lower open area -->
  <g class="socket"><rect x="1132" y="560" width="16" height="22"/><rect x="1132" y="685" width="16" height="22"/><rect x="975" y="716" width="22" height="16"/><rect x="845" y="716" width="22" height="16"/></g>
  <!-- D4 wet zone -->
  <g class="socket"><rect x="715" y="584" width="16" height="22"/><rect x="715" y="684" width="16" height="22"/></g>
  <g transform="translate(1210 165)"><rect class="note" width="160" height="310" rx="10"/><text class="txt" x="18" y="38">图例</text><rect class="socket" x="18" y="60" width="22" height="16"/><text class="small" x="52" y="75">预留插座点</text><path class="route" d="M18 108H45"/><text class="small" x="52" y="113">普通插座回路</text><path class="route2" d="M18 148H45"/><text class="small" x="52" y="153">卫浴防溅回路</text><rect class="db" x="18" y="177" width="38" height="25"/><text class="small" x="65" y="196">配电箱</text><text class="small" x="18" y="232">D1：办公预留</text><text class="small" x="18" y="257">D2：吧台/健身</text><text class="small" x="18" y="282">D3：开放预留</text><text class="small" x="18" y="307">D4：卫浴防溅</text></g>
  <rect class="note" x="70" y="842" width="1110" height="45" rx="8"/><text class="small" x="90" y="870">施工前由持证电工根据实际设备功率、物业要求和现场配电容量确定断路器、线径、漏保及最终走线；卫生间插座应采用带漏保的防溅方案。</text>
</svg>
