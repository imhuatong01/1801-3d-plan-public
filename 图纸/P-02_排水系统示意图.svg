<text x="314.00" y="52.97" font-size="2.40" text-anchor="start" fill="#000">结构楼板</text>
<text x="296.00" y="62.00" font-size="3.20" text-anchor="start" fill="#000" font-weight="bold">说 明</text>
<line x1="296.00" y1="63.40" x2="408.00" y2="63.40" stroke="#000" stroke-width="0.40" fill="none"/>
<text x="296.00" y="67.20" font-size="2.25" text-anchor="start" fill="#000">1.</text>
<text x="301.00" y="67.20" font-size="2.25" text-anchor="start" fill="#000">排水管埋深：De50 圆管外径 50，管顶以上留 30 的面层、防水和找平，不算坡度最少要 80 mm 埋深。</text>
<text x="301.00" y="70.58" font-size="2.25" text-anchor="start" fill="#000">地漏和花洒设在靠入口短廊一侧后，地漏到入户门约 3.25 m，按 1.2% 只需再降 39 mm，150 的垫高层</text>
<text x="301.00" y="73.95" font-size="2.25" text-anchor="start" fill="#000">可以满足，余量不大。</text>
<text x="296.00" y="77.83" font-size="2.25" text-anchor="start" fill="#000">2.</text>
<text x="301.00" y="77.83" font-size="2.25" text-anchor="start" fill="#000">坡度：最小 1.2%，宜取 2.5%。De50 按起点管底 -0.080 可做到约 2.2%；计入地漏本体多占 20 后约</text>
<text x="301.00" y="81.20" font-size="2.25" text-anchor="start" fill="#000"> 1.5%。施工按能做到的最大坡度做，不小于 1.2%。</text>
<text x="296.00" y="85.08" font-size="2.25" text-anchor="start" fill="#000">3.</text>
<text x="301.00" y="85.08" font-size="2.25" text-anchor="start" fill="#000">薄型配件：同层排水有专用的薄型侧排地漏和浅水封存水弯，可比普通件少占 10~20 mm 高度；规格、本</text>
<text x="301.00" y="88.45" font-size="2.25" text-anchor="start" fill="#000">体高度、水封深度以厂家样本为准，选型后按样本数据复算本表。地漏选深水封、防返溢型。</text>
<text x="296.00" y="92.33" font-size="2.25" text-anchor="start" fill="#000">4.</text>
<text x="301.00" y="92.33" font-size="2.25" text-anchor="start" fill="#000">De75：可用落差 45 mm，按 1.2% 需 39 mm，可行但余量小；淋浴加洗手盆用 De50 即可，是否加大由</text>
<text x="301.00" y="95.70" font-size="2.25" text-anchor="start" fill="#000">给排水工程师定。</text>
<text x="296.00" y="99.58" font-size="2.25" text-anchor="start" fill="#000">5.</text>
<text x="301.00" y="99.58" font-size="2.25" text-anchor="start" fill="#000">门外段：本表只算到入户门。公共管井位置由物业确定后，按门外实际管长复算；门外公共走廊无垫层时，</text>
<text x="301.00" y="102.95" font-size="2.25" text-anchor="start" fill="#000">须在入户门处直接接入管井或另定接法。复算通过前不得回填。</text>
<text x="296.00" y="106.83" font-size="2.25" text-anchor="start" fill="#000">6.</text>
<text x="301.00" y="106.83" font-size="2.25" text-anchor="start" fill="#000">存水弯与通气：洗手盆下 P 形存水弯，水封不小于 50 mm；地漏自带水封。洗手盆一端设吸气阀，通气方</text>
<text x="301.00" y="110.20" font-size="2.25" text-anchor="start" fill="#000">案由给排水工程师核定。转弯处和入户门内侧各设清扫口。</text>
<text x="296.00" y="114.08" font-size="2.25" text-anchor="start" fill="#000">7.</text>
<text x="301.00" y="114.08" font-size="2.25" text-anchor="start" fill="#000">试验：回填前做 24 h 闭水试验。淋浴净高约 1.980 m，不宜再加高垫层。</text>
<text x="296.00" y="117.95" font-size="2.25" text-anchor="start" fill="#000">8.</text>
<text x="301.00" y="117.95" font-size="2.25" text-anchor="start" fill="#000">待核：公共管井位置(物业书面同意)、穿板备选点与 17 楼接点、楼板厚度及梁筋、地漏选型。垫高层内</text>
<text x="301.00" y="121.33" font-size="2.25" text-anchor="start" fill="#000">只走排水管，电线管和给水管不进垫高层。</text>
</svg>
