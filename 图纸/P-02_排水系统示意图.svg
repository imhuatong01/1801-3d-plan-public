<text x="100.00" y="149.20" font-size="2.20" text-anchor="start" fill="#000">39</text>
<text x="120.00" y="149.20" font-size="2.20" text-anchor="start" fill="#000">81</text>
<text x="140.00" y="149.20" font-size="2.20" text-anchor="start" fill="#000">50</text>
