<text x="176.00" y="149.20" font-size="2.20" text-anchor="start" fill="#000">-0.139</text>
<text x="206.00" y="149.20" font-size="2.20" text-anchor="start" fill="#1b7a2b" font-weight="bold">1.2% 余 11；2.5% 缺 31</text>
