<text x="14.00" y="161.10" font-size="2.10" text-anchor="start" fill="#000">取值：管顶以上留面层/防水/找平 30；De50 外径 50，De75 外径 75；终点管底不得低于结构面 -0.150；可用落差 = 起点管底 - (-150)。本表算到入户门；门外至公共管井每延长 1 m 按 1.2% 另需 12 mm，管井接点确定后复算。地漏本体高度以所选样本为准，第二行按多占 20 估</text>
<text x="14.00" y="164.32" font-size="2.10" text-anchor="start" fill="#000">算。</text>
<text x="296.00" y="20.00" font-size="3.20" text-anchor="start" fill="#000" font-weight="bold">图 例</text>
