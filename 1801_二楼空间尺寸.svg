<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img">
<title>1801 · 夹层楼面尺寸</title><desc>与一楼同向，正门位于图面下方。</desc>
<defs>
